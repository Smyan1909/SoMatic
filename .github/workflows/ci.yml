name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e .[dev]
      # Install numpy so the YOLO ONNX inference tests run on CI. We deliberately
      # skip the full [vision] extra (onnxruntime, ultralytics, torch) to keep CI
      # fast — tests use a _FakeSession stub for inference.
      - run: python -m pip install "numpy>=1.24"
      - run: python -m pytest
      - run: node bin/somatic.js wait 0
      - run: npm pack --dry-run
