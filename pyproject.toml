[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The `somatic` distribution name is taken by an
# unrelated documentation framework; we publish as `somatic-cli` (matching
# the npm package `@somatic-cli/cli`). The import name is still `somatic`
# (i.e., `from somatic.cli import main`).
name = "somatic-cli"
version = "0.1.0"
description = "Agent-first CLI for native UI automation with Set-of-Marks screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SoMatic contributors" }]
keywords = ["automation", "pyautogui", "computer-use", "cli", "agents", "set-of-marks", "desktop-automation", "gui-grounding", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "Pillow>=10.0",
  "PyAutoGUI>=0.9.54",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
vision = [
  # MIT/BSD/Apache only — keeps SoMatic's MIT distribution clean.
  # Conversion (.pt → .onnx) is intentionally NOT here; that path lives in
  # tools/ with its own AGPL-licensed requirements.txt because ultralytics
  # is AGPL-3.0. See tools/README.md.
  "onnxruntime>=1.17",
  "numpy>=1.24",
  "huggingface-hub>=0.23",
]
mcp = [
  "mcp[cli]>=1.2",
]

[project.urls]
Homepage = "https://github.com/Smyan1909/SoMatic"
Repository = "https://github.com/Smyan1909/SoMatic"
"Bug Tracker" = "https://github.com/Smyan1909/SoMatic/issues"

[project.scripts]
somatic = "somatic.cli:main"
somatic-mcp = "somatic.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/somatic"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "somatic/SKILL.md"

[tool.hatch.build.targets.sdist]
# Source distribution is MIT-only. `tools/` is excluded so PyPI sdists never
# carry the AGPL-licensed conversion tool. `benchmarks/` is excluded because
# it's dev-time tooling. Same for tests/scripts.
include = [
  "src/somatic/",
  "bin/",
  "docs/",
  "SKILL.md",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]
exclude = [
  "tools/",
  "benchmarks/",
  "tests/",
  "scripts/",
  "**/__pycache__/",
  "**/*.pyc",
  ".venv/",
  ".github/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
